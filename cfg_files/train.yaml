Paths:
  source_path: "./data/oven/101917"
  output_path: "./output/test"

Pipeline:
  # total_iterations: 25_000
  only_train_single_frame: 4000
  deform_net: 8_000
  rigid_trans: 10_000
  end: 25_000
  report_interval: 6000

  tb_writer: True
  eval: True
  save_its: [200, 7000, 30000]
  test_its: [7000, 10000, 14500, 16500]
  use_tb_writer: True
  convert_SHs_python: False
  compute_cov3D_python: False
  debug: False
  antialiasing: False
  estimate_pcd: False
  white_background: False
  load2gpu_on_the_fly: False
  data_device: "cuda"
  resolution: 1.0

  render_gif: True

DeformNet:
  position_lr_init: 0.00016
  position_lr_final: 0.0000016
  position_lr_delay_mult: 0.01
  deform_lr_max_steps: 35_000

Gaussians:
  sh_degree: 3
  alpha_lr: 0.00016
  shift_along_normal_lr: 0.0001
  position_lr_max_steps: 30_000
  feature_lr: 0.0025
  opacity_lr: 0.025
  scaling_lr: 0.005
  rotation_lr: 0.001
  exposure_lr_init: 0.01
  exposure_lr_final: 0.001
  exposure_lr_delay_steps: 0
  exposure_lr_delay_mult: 0.0
  percent_dense: 0.01
  position_lr_init: 0.00016
  position_lr_final: 0.0000016
  position_lr_delay_mult: 0.01
  densify_from_iter: 50
  densify_until_iter: 15_000
  densify_grad_threshold: 0.0002
  stop_densify: 30_000
  depth_l1_weight_init: 1.0
  depth_l1_weight_final: 0.01
  random_background: False
  optimizer_type: "default"
  densification_interval: 100
  opacity_reset_interval: 3000
  lambda_dssim: 0.2
